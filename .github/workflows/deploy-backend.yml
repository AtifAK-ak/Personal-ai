name: Deploy backend (optional)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger the host's deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::notice::DEPLOY_HOOK_URL secret is not set; nothing deployed."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
