name: Android CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.x'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-flutter341-${{ hashFiles('frontend/pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-flutter341-

      - name: Show tool versions
        run: |
          flutter --version
          java -version
          dart --version

      - name: Generate Android scaffold (matches the pinned Flutter version)
        run: flutter create --org com.atif --project-name alex_ai --platforms=android .

      - name: Apply ALEX Kotlin layer and manifest
        run: python3 tool/patch_android.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Use the fixed debug signing key (so app updates keep your data and keys)
        run: |
          mkdir -p ~/.android
          cp android_overrides/debug.keystore ~/.android/debug.keystore

      - name: Build release APK (compiles Kotlin too)
        run: |
          set -o pipefail
          flutter build apk --release -v 2>&1 | tee build.log

      - name: Verify APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK" || { echo "::error::APK not found"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 5000000 || { echo "::error::APK too small"; exit 1; }
          unzip -tq "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1 || true)
          if [ -n "$AAPT" ]; then "$AAPT" dump badging "$APK" | head -5; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALEX-AI-release-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: frontend/build.log
          if-no-files-found: ignore
